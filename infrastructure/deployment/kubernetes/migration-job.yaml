apiVersion: batch/v1
kind: Job
metadata:
  name: tour-platform-migrate
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tour-platform-migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/tour-platform/api:1.0.0
          imagePullPolicy: IfNotPresent
          command: ["php", "artisan", "migrate", "--force"]
          envFrom:
            - configMapRef:
                name: tour-platform-config
            - secretRef:
                name: tour-platform-runtime
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: runtime
              mountPath: /workspace/apps/api/storage
            - name: cache
              mountPath: /workspace/apps/api/bootstrap/cache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: runtime
          emptyDir: {}
        - name: cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
