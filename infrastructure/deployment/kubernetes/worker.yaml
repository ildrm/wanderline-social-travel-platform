apiVersion: apps/v1
kind: Deployment
metadata:
  name: tour-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: tour-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tour-worker
    spec:
      terminationGracePeriodSeconds: 45
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ghcr.io/tour-platform/api:1.0.0
          imagePullPolicy: IfNotPresent
          command: ["php", "artisan", "queue:work"]
          args: ["--sleep=1", "--tries=3", "--timeout=120", "--max-time=3600"]
          envFrom:
            - configMapRef:
                name: tour-platform-config
            - secretRef:
                name: tour-platform-runtime
          env:
            - name: OTEL_SERVICE_NAME
              value: tour-worker
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: runtime
              mountPath: /workspace/apps/api/storage
            - name: cache
              mountPath: /workspace/apps/api/bootstrap/cache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: runtime
          emptyDir: {}
        - name: cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
