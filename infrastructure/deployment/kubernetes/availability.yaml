apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: tour-api
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: tour-api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: tour-web
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: tour-web
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: tour-worker
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tour-worker
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tour-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tour-api
  minReplicas: 3
  maxReplicas: 12
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tour-web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tour-web
  minReplicas: 3
  maxReplicas: 12
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

