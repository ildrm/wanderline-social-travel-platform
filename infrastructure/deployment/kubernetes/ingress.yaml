apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tour-platform
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - tour-platform.example
        - api.tour-platform.example
      secretName: tour-platform-tls
  rules:
    - host: tour-platform.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tour-web
                port:
                  name: http
    - host: api.tour-platform.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tour-api
                port:
                  name: http

