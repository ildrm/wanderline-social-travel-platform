apiVersion: apps/v1
kind: Deployment
metadata:
  name: tour-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: tour-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tour-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/tour-platform/api:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: tour-platform-config
            - secretRef:
                name: tour-platform-runtime
          env:
            - name: OTEL_SERVICE_NAME
              value: tour-api
          readinessProbe:
            httpGet:
              path: /up
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /up
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /up
              port: http
            periodSeconds: 5
            failureThreshold: 18
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: runtime
              mountPath: /workspace/apps/api/storage
            - name: cache
              mountPath: /workspace/apps/api/bootstrap/cache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: runtime
          emptyDir: {}
        - name: cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: tour-api
spec:
  selector:
    app.kubernetes.io/name: tour-api
  ports:
    - name: http
      port: 8080
      targetPort: http

