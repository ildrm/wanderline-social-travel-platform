apiVersion: apps/v1
kind: Deployment
metadata:
  name: tour-web
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: tour-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tour-web
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/tour-platform/web:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: 0.0.0.0
            - name: INTERNAL_API_URL
              value: http://tour-api:8080
            - name: NEXT_PUBLIC_API_URL
              value: https://api.tour-platform.example
            - name: NEXT_PUBLIC_APP_URL
              value: https://tour-platform.example
            - name: OTEL_SERVICE_NAME
              value: tour-web
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.observability.svc.cluster.local:4318
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: tour-web
spec:
  selector:
    app.kubernetes.io/name: tour-web
  ports:
    - name: http
      port: 3000
      targetPort: http
