bind 0.0.0.0
# The Compose port is bound to host loopback and the app network is isolated.
# Redis must accept peer containers, which protected mode denies without ACLs.
protected-mode no
port 6379
databases 16
appendonly yes
appendfsync everysec
save 3600 1 300 100 60 10000
maxmemory-policy noeviction
tcp-keepalive 300
timeout 0
loglevel notice
